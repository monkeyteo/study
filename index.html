<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 김승한님의 자식 이름 추천기: 프리미엄</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-main: #030712;
            --accent-primary: #6366f1;
            --accent-secondary: #a855f7;
            --accent-tertiary: #ec4899;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            perspective: 1000px;
            padding: 1rem;
        }

        /* --- Dynamic Background Blobs --- */
        .blob-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            filter: blur(60px);
            opacity: 0.6;
        }

        .blob {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            animation: move 20s infinite alternate;
        }

        @media (min-width: 768px) {
            .blob {
                width: 400px;
                height: 400px;
            }
        }

        .blob-1 { background: var(--accent-primary); top: -5%; left: -5%; }
        .blob-2 { background: var(--accent-secondary); bottom: -5%; right: -5%; }
        .blob-3 { background: var(--accent-tertiary); top: 40%; left: 30%; }

        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(100px, 100px) scale(1.2); }
        }

        /* --- Main Container (Glassmorphism) --- */
        .container {
            width: 100%;
            max-width: 440px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 2rem;
            padding: 2.5rem 1.5rem;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            z-index: 10;
            transition: transform 0.3s ease;
            margin: auto;
        }

        /* --- Pages & Animations --- */
        .page {
            display: none;
            opacity: 0;
            transform: scale(0.95);
        }

        .page.active {
            display: block;
            animation: pageEnter 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes pageEnter {
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            font-size: clamp(1.4rem, 6vw, 2rem); /* Dynamic font size to prevent cutting */
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap; /* Force one line */
        }

        .subtitle {
            color: var(--text-dim);
            font-size: clamp(0.8rem, 4vw, 0.95rem); /* Dynamic font size */
            margin-bottom: 2.5rem;
            white-space: nowrap; /* Force one line */
        }

        /* --- Name Grid --- */
        .name-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .name-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1.25rem 0.5rem;
            border-radius: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.15rem;
            font-weight: 700;
            -webkit-tap-highlight-color: transparent;
        }

        .name-card:active {
            transform: scale(0.95);
            background: rgba(99, 102, 241, 0.3);
        }

        @media (hover: hover) {
            .name-card:hover {
                background: rgba(99, 102, 241, 0.2);
                border-color: var(--accent-primary);
                transform: scale(1.05);
            }
        }

        /* --- Buttons --- */
        .btn-main {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            padding: 1.1rem;
            border-radius: 1.25rem;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.5);
        }

        .btn-main:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn-text {
            background: none;
            border: none;
            color: var(--text-dim);
            margin-top: 1.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: color 0.3s;
        }

        .btn-text:hover { color: white; }

        /* --- Result Page --- */
        .gender-badge {
            display: inline-block;
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .result-name {
            font-size: 3.5rem;
            font-weight: 900;
            margin: 1rem 0;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @media (min-width: 480px) {
            .result-name { font-size: 4.5rem; }
            .container { padding: 3rem 2rem; }
            .name-grid { gap: 1rem; }
        }
    </style>
</head>
<body>

    <div class="blob-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container" id="app">
        <!-- Step 1: Selection -->
        <div id="page-selection" class="page active">
            <h1>김승한님의 자식 이름</h1>
            <p class="subtitle">미래의 아이를 위한 최고의 이름을 선택하세요</p>
            
            <div id="nameGrid" class="name-grid">
                <!-- Names injected here -->
            </div>

            <button class="btn-main" onclick="shuffleNames()">🌀 새로운 후보 추천받기</button>
        </div>

        <!-- Step 2: Result -->
        <div id="page-result" class="page">
        <div id="genderBadge" class="gender-badge">딸입니다!</div>
        <p style="color: var(--text-dim); font-weight: 500;">축하합니다! 최종 확정된 이름은</p>
        <div class="result-name">김<span id="finalName">불킥</span></div>
            <button class="btn-main" onclick="resetApp()">다른 이름도 고르기</button>
            <br>
            <button class="btn-text" onclick="resetApp()">◀ 처음으로 돌아가기</button>
        </div>
    </div>

    <script>
        const namePool = [
            "건제", "유민", "치녀", "이유경",
            "모카세", "불킥", "리조리", "지안", "서준", "하린", 
            "유진", "도윤", "시아", "은우", "태오", "아린",
            "루피", "뽀로로", "자바", "파이썬", "디비", "서버",
            "이름", "무명", "대박", "로또", "행복", "사랑",
            "코딩", "버그", "커밋", "푸시", "클라우드", "에이아이"
        ];

        function shuffleNames() {
            const shuffled = [...namePool].sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, 6);
            const grid = document.getElementById('nameGrid');
            
            // Add slight delay for animation feel
            grid.style.opacity = '0';
            setTimeout(() => {
                grid.innerHTML = '';
                selected.forEach(name => {
                    const card = document.createElement('div');
                    card.className = 'name-card';
                    card.innerText = name;
                    card.onclick = () => showResult(name);
                    grid.appendChild(card);
                });
                grid.style.opacity = '1';
                grid.style.transition = 'opacity 0.3s';
            }, 200);
        }

        function showResult(name) {
            const genders = ["아들", "딸"];
            const gender = genders[Math.floor(Math.random() * genders.length)];
            
            document.getElementById('genderBadge').innerText = `✨ 축하합니다! ${gender}입니다!`;
            document.getElementById('finalName').innerText = name;

            // Confetti Blast
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#6366f1', '#a855f7', '#ec4899', '#ffffff']
            });

            // Transition
            document.getElementById('page-selection').classList.remove('active');
            setTimeout(() => {
                document.getElementById('page-result').classList.add('active');
            }, 150);
        }

        function resetApp() {
            document.getElementById('page-result').classList.remove('active');
            setTimeout(() => {
                document.getElementById('page-selection').classList.add('active');
                shuffleNames();
            }, 150);
        }

        // Initialize
        shuffleNames();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이세중 자식 이름 추천기</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0e14;
            --bg-card: #151921;
            --bg-sidebar: #0f1218;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.2);
            --border: #262c36;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--bg-card);
            padding: 3rem;
            border-radius: 1.5rem;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .congrats-box {
            background: var(--bg-sidebar);
            padding: 1.5rem;
            border-radius: 1rem;
            margin-bottom: 2rem;
            border: 1px solid var(--accent);
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--accent);
        }

        .name-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .name-card {
            background: var(--bg-sidebar);
            padding: 1.25rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .name-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            background: rgba(99, 102, 241, 0.1);
        }

        .result-box {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            border-top: 1px solid var(--border);
            margin-top: 1rem;
        }

        .reset-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            margin-top: 1rem;
        }

        .reset-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>👶 이세중 자식 이름 추천기</h1>
        
        <div id="congrats" class="congrats-box">
            결과를 확인하는 중...
        </div>

        <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">마음에 드는 이름을 선택해 보세요!</p>

        <div class="name-grid">
            <div class="name-card" onclick="selectName('모카세')">모카세</div>
            <div class="name-card" onclick="selectName('불킥')">불킥</div>
            <div class="name-card" onclick="selectName('리조리')">리조리</div>
            <div class="name-card" onclick="selectName('지안')">지안</div>
            <div class="name-card" onclick="selectName('서준')">서준</div>
            <div class="name-card" onclick="selectName('하린')">하린</div>
        </div>

        <div id="result" class="result-box">
            이름을 선택해 주세요
        </div>

        <button class="reset-btn" onclick="init()">다시 하기</button>
    </div>

    <script>
        const surname = "이";
        
        function init() {
            const genders = ["아들", "딸"];
            const randomGender = genders[Math.floor(Math.random() * genders.length)];
            document.getElementById('congrats').innerText = `🎉 축하합니다! ${randomGender}입니다!`;
            document.getElementById('result').innerText = "이름을 선택해 주세요";
        }

        function selectName(name) {
            document.getElementById('result').innerHTML = `최종 이름: <span style="color: var(--accent); margin-left: 10px;">${surname}${name}</span>`;
        }

        // 초기 실행
        init();
    </script>

</body>
</html>

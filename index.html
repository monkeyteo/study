<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이세중님의 자식 이름 추천기</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0e14;
            --bg-card: #151921;
            --bg-sidebar: #0f1218;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.2);
            --border: #262c36;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: 2rem;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Pages */
        .page {
            display: none;
            animation: fadeIn 0.6s ease-out forwards;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .name-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .name-card {
            background: var(--bg-sidebar);
            padding: 1.5rem;
            border-radius: 1rem;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1.2rem;
            font-weight: 600;
        }

        .name-card:hover {
            border-color: var(--accent);
            transform: scale(1.05);
            background: rgba(99, 102, 241, 0.1);
            box-shadow: 0 10px 20px -5px var(--accent-glow);
        }

        /* Result Page Styles */
        .congrats-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: #10b981;
            margin-bottom: 1.5rem;
            display: block;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        .full-name-display {
            font-size: 3.5rem;
            font-weight: 800;
            margin: 2rem 0;
            letter-spacing: -1px;
        }

        .full-name-display span {
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 0.6rem 1.5rem;
            border-radius: 2rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            margin-top: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .shuffle-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 2rem;
            cursor: pointer;
            font-weight: 600;
            margin-top: 1rem;
            width: 100%;
            transition: opacity 0.2s;
        }

        .shuffle-btn:hover {
            opacity: 0.9;
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- Step 1: Selection Page -->
        <div id="page1" class="page active">
            <h1>👶 이세중님의 자식 이름 고르기</h1>
            <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">마음에 드는 이름을 하나 선택해주세요.</p>
            
            <div id="nameGrid" class="name-grid">
                <!-- Names will be injected here -->
            </div>

            <button class="shuffle-btn" onclick="shuffleNames()">🌀 다른 이름 추천받기</button>
        </div>

        <!-- Step 2: Result Page -->
        <div id="page2" class="page">
            <span id="congratsText" class="congrats-text">축하합니다!</span>
            <p style="color: var(--text-secondary);">세상에 태어날 아이의 이름은...</p>
            <div class="full-name-display">
                이<span id="chosenName"></span>
            </div>
            <button class="btn-secondary" onclick="reset()">◀ 다시 고르기</button>
        </div>
    </div>

    <script>
        const namePool = [
            "모카세", "불킥", "리조리", "지안", "서준", "하린", 
            "유진", "도윤", "시아", "은우", "태오", "아린",
            "루피", "뽀로로", "자바", "파이썬", "디비", "서버",
            "이름", "무명", "대박", "로또", "행복", "사랑"
        ];

        function shuffleNames() {
            const shuffled = [...namePool].sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, 6);
            
            const grid = document.getElementById('nameGrid');
            grid.innerHTML = '';
            
            selected.forEach(name => {
                const card = document.createElement('div');
                card.className = 'name-card';
                card.innerText = name;
                card.onclick = () => showResult(name);
                grid.appendChild(card);
            });
        }

        function showResult(name) {
            const genders = ["아들", "딸"];
            const randomGender = genders[Math.floor(Math.random() * genders.length)];
            
            document.getElementById('congratsText').innerText = `🎉 축하합니다! ${randomGender}입니다!`;
            document.getElementById('chosenName').innerText = name;

            document.getElementById('page1').classList.remove('active');
            setTimeout(() => {
                document.getElementById('page2').classList.add('active');
            }, 100);
        }

        function reset() {
            document.getElementById('page2').classList.remove('active');
            setTimeout(() => {
                document.getElementById('page1').classList.add('active');
                shuffleNames(); // 돌아갈 때 새로운 이름들로 셔플
            }, 100);
        }

        // 초기화
        shuffleNames();
    </script>

</body>
</html>

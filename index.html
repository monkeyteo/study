<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이세중 자식 이름 추천기</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0e14;
            --bg-card: #151921;
            --bg-sidebar: #0f1218;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.2);
            --border: #262c36;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: 2rem;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Pages */
        .page {
            display: none;
            animation: fadeIn 0.6s ease-out forwards;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 2rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .name-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.25rem;
        }

        .name-card {
            background: var(--bg-sidebar);
            padding: 1.5rem;
            border-radius: 1rem;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1.2rem;
            font-weight: 600;
        }

        .name-card:hover {
            border-color: var(--accent);
            transform: scale(1.05);
            background: rgba(99, 102, 241, 0.1);
            box-shadow: 0 10px 20px -5px var(--accent-glow);
        }

        /* Result Page Styles */
        .congrats-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: #10b981;
            margin-bottom: 1.5rem;
            display: block;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        .full-name-display {
            font-size: 3.5rem;
            font-weight: 800;
            margin: 2rem 0;
            letter-spacing: -1px;
        }

        .full-name-display span {
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .reset-btn {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 0.8rem 2rem;
            border-radius: 2rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            margin-top: 2rem;
        }

        .reset-btn:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        /* Particle effect placeholder */
        .confetti {
            position: absolute;
            top: -50px;
            left: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Step 1: Selection Page -->
        <div id="page1" class="page active">
            <h1>👶 자식 이름 고르기</h1>
            <p style="color: var(--text-secondary); margin-bottom: 2rem;">이세중 님의 아이 이름을 하나 선택해주세요.</p>
            <div class="name-grid">
                <div class="name-card" onclick="showResult('모카세')">모카세</div>
                <div class="name-card" onclick="showResult('불킥')">불킥</div>
                <div class="name-card" onclick="showResult('리조리')">리조리</div>
                <div class="name-card" onclick="showResult('지안')">지안</div>
                <div class="name-card" onclick="showResult('서준')">서준</div>
                <div class="name-card" onclick="showResult('하린')">하린</div>
            </div>
        </div>

        <!-- Step 2: Result Page -->
        <div id="page2" class="page">
            <span id="congratsText" class="congrats-text">축하합니다!</span>
            <p style="color: var(--text-secondary);">세상에 태어날 아이의 이름은...</p>
            <div class="full-name-display">
                이<span id="chosenName"></span>
            </div>
            <button class="reset-btn" onclick="reset()">다시 선택하기</button>
        </div>
    </div>

    <script>
        function showResult(name) {
            const genders = ["아들", "딸"];
            const randomGender = genders[Math.floor(Math.random() * genders.length)];
            
            // 데이터 설정
            document.getElementById('congratsText').innerText = `🎉 축하합니다! ${randomGender}입니다!`;
            document.getElementById('chosenName').innerText = name;

            // 페이지 전환 애니메이션
            document.getElementById('page1').classList.remove('active');
            setTimeout(() => {
                document.getElementById('page2').classList.add('active');
            }, 100);
        }

        function reset() {
            document.getElementById('page2').classList.remove('active');
            setTimeout(() => {
                document.getElementById('page1').classList.add('active');
            }, 100);
        }
    </script>

</body>
</html>
